# Configuración común del short paper. El contenido vive en short-paper.qmd y es uno solo; cada estilo es un
# perfil de Quarto con su propio archivo, que solo agrega el formato:
#
#   _quarto-generico.yml  PDF de artículo genérico (el perfil por defecto)
#   _quarto-ieee.yml      IEEE de conferencia: IEEEtran, dos columnas (plantilla propia en estilos/ieee/)
#   _quarto-lncs.yml      Springer LNCS: llncs, una columna (plantilla propia en estilos/lncs/)
#   _quarto-elsevier.yml  Elsevier: elsarticle en modo preprint, una columna (extensión quarto-journals/elsevier)
#
# Ejemplo: quarto render short-paper.qmd --profile ieee --to pdf. Ver README.md.

project:
  type: default
  render:
    - short-paper.qmd

profile:
  default: generico
  group:
    - [generico, ieee, lncs, elsevier]

number-sections: true
date-format: long
link-citations: true

format:
  # Vista previa sin LaTeX: `quarto render --to html` (un solo archivo, con las figuras dentro).
  html:
    embed-resources: true
    toc: false
    fig-cap-location: bottom
    tbl-cap-location: top
