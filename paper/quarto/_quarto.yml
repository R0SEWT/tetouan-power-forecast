# Configuración del short paper: el contenido vive en short-paper.qmd; aquí solo va el formato.
# PDF: IEEE de conferencia (IEEEtran, dos columnas, Times, referencias IEEE). No hay una extensión de Quarto
# mantenida para IEEE, así que va con la clase y tres piezas propias en estilos/: el bloque de autores
# (title.tex y autores.lua), el preámbulo y un filtro que convierte las tablas en flotantes (tablas.lua). Ver README.md.

project:
  type: default
  render:
    - short-paper.qmd

number-sections: true
link-citations: true
csl: estilos/ieee.csl

format:
  pdf:
    documentclass: IEEEtran
    classoption: [conference]
    fontfamily: mathptmx
    pdf-engine: pdflatex
    template-partials:
      - estilos/title.tex
    include-in-header: estilos/preambulo.tex
    filters:
      - estilos/autores.lua
      - estilos/tablas.lua
    tablas-entorno: "table*"
    default-image-extension: pdf
    fig-pos: "!htbp"
    fig-cap-location: bottom
    tbl-cap-location: top
  # Vista previa sin LaTeX: `quarto render --to html` (un solo archivo, con las figuras dentro).
  html:
    embed-resources: true
    toc: false
    default-image-extension: png
    fig-cap-location: bottom
    tbl-cap-location: top
