# IEEE de conferencia: IEEEtran a dos columnas, Times, referencias IEEE numéricas (CSL oficial del IEEE).
# No hay una extensión de Quarto mantenida para IEEE (las que existen no se actualizan desde 2023-2025 y no
# resuelven las tablas a dos columnas), así que va con la clase y un bloque de autores propio
# (estilos/ieee/title.tex). Tablas y figuras a lo ancho de la página.
csl: estilos/csl/ieee.csl
format:
  pdf:
    documentclass: IEEEtran
    classoption: [conference]
    fontfamily: mathptmx
    pdf-engine: pdflatex
    template-partials:
      - estilos/ieee/title.tex
    include-in-header:
      - estilos/comun/preambulo.tex
      - estilos/ieee/preambulo.tex
    filters:
      - estilos/comun/tablas.lua
    tablas-entorno: "table*"
    fig-env: figure*
    fig-pos: tp
    fig-cap-location: bottom
    tbl-cap-location: top
    keep-tex: true
