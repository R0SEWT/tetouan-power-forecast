[project]
name = "tetouan-power-forecast"
version = "0.1.0"
description = "Pronóstico del consumo eléctrico de la Zona 1 de Tetuán a una hora (t+6), con CRISP-DM"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ucimlrepo>=0.0.7",
    "pyarrow>=15.0",
]

[project.scripts]
tetouan = "tetouan_power_forecast.medallon:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyterlab>=4.0"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetouan_power_forecast"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Los notebooks vienen de Colab y se revisan a mano; ruff cubre src/ y tests/.
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # para importar experimentos/ desde los tests
